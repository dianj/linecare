<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LineCare · Quillnet support</title>
<style>
    :root {
        --bg: #0f1419; --panel: #161d24; --panel-2: #1e2731; --line: #2e3a46;
        --text: #e9eef3; --muted: #93a1ae; --accent: #3fb6c9; --accent-ink: #062027;
        --ok: #5fb37a; --warn: #e8b33d; --bad: #e06c5a; --user: #23404a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }
    .app { display: grid; grid-template-columns: minmax(380px, 1.4fr) minmax(300px, 1fr); height: 100vh; }
    .chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    header .sub { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    button { font: inherit; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .ghost:hover { border-color: var(--accent); }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 86%; padding: 12px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .msg.bot.error { border: 1px solid var(--bad); }
    .msg.typing { color: var(--muted); }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
    .tool { font: 12px ui-monospace, Consolas, monospace; background: #0b1015; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
    .tool::before { content: "●"; margin-right: 5px; color: var(--ok); }
    .tool.blocked::before, .tool.needs_confirmation::before { color: var(--warn); }
    .tool.error::before, .tool.system_error::before { color: var(--bad); }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
    .source { font-size: 12px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
    .source[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
    .passage { margin-top: 8px; padding: 10px 12px; border-left: 3px solid var(--accent); background: #0b1015; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
    .passage strong { display: block; margin-bottom: 4px; color: var(--muted); font-weight: 600; }
    .quick { display: flex; gap: 8px; margin-top: 10px; }
    form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
    textarea { flex: 1; resize: none; height: 52px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
    .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
    .primary:disabled { opacity: .5; cursor: wait; }
    #mic { width: 52px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 20px; cursor: pointer; }
    #mic.recording { background: var(--bad); border-color: var(--bad); animation: pulse 1.2s infinite; }
    #mic:disabled { opacity: .45; cursor: not-allowed; animation: none; }
    @keyframes pulse { 50% { opacity: .6; } }
    .voicebar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 20px 0; color: var(--muted); font-size: 13px; }
    .voicebar select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
    #hint { min-height: 1em; }
    aside { padding: 20px; overflow-y: auto; background: var(--panel); }
    aside h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
    .state { display: flex; flex-direction: column; gap: 6px; margin-bottom: 26px; font-size: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
    .badge.verified { border-color: var(--ok); color: var(--ok); }
    .badge.locked { border-color: var(--bad); color: var(--bad); }
    .badge.handed_over { border-color: var(--warn); color: var(--warn); }
    .fact { color: var(--text); }
    .fact span { color: var(--muted); }
    .pending { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    td.mono { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
    .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
    <section class="chat">
        <header>
            <div>
                <h1>LineCare</h1>
                <div class="sub">Quillnet support assistant · fictional demo</div>
            </div>
            <div class="spacer"></div>
            <button class="ghost" id="newChat" type="button">New conversation</button>
        </header>
        <div id="messages" aria-live="polite"></div>
        <div class="voicebar">
            <label><input type="checkbox" id="voiceReplies"> Voice replies</label>
            <select id="voiceGender" aria-label="Voice">
                <option value="female">Female voice</option>
                <option value="male">Male voice</option>
            </select>
            <select id="speechLanguage" aria-label="Speech language">
                <option value="auto">Speech: auto</option>
                <option value="en">Speech: English</option>
                <option value="bg">Speech: Български</option>
            </select>
            <span id="hint" aria-live="polite"></span>
        </div>
        <form id="composer">
            <button id="mic" type="button" title="Record a voice message" aria-label="Record a voice message">🎤</button>
            <textarea id="input" aria-label="Message" placeholder="Describe the problem… (Enter to send, Shift+Enter for a new line)"></textarea>
            <button class="primary" id="send" type="submit">Send</button>
        </form>
    </section>
    <aside>
        <h2>Conversation state</h2>
        <div class="state" id="state"></div>
        <h2>Demo customers</h2>
        <table>
            <thead><tr><th>Account</th><th>PIN</th><th>Scenario</th></tr></thead>
            <tbody id="demo"></tbody>
        </table>
        <p class="note">Fictional accounts for trying the scenarios. Nothing is filled in automatically.</p>
    </aside>
</div>
<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');
const mic = document.getElementById('mic');
const hint = document.getElementById('hint');
const player = new Audio();
const MAX_RECORD_MS = 30000;
let recorder = null, chunks = [], recordTimer = null;

// Every model or user text is set with textContent: nothing from the conversation is parsed as HTML.
function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

// Source chips come from the search_help tool results, not from the model's text (ARCHITECTURE.md §8.5).
function addSources(bubble, toolCalls) {
    const seen = new Set();
    const sources = [];
    for (const call of toolCalls || []) {
        for (const source of call.sources || []) {
            const key = `${source.doc_id} §${source.section}`;
            if (!seen.has(key)) { seen.add(key); sources.push([key, source]); }
        }
    }
    if (!sources.length) return;
    const row = el('div', 'sources');
    let open = null;
    for (const [key, source] of sources) {
        const chip = el('button', 'source', key);
        chip.type = 'button';
        chip.setAttribute('aria-expanded', 'false');
        chip.addEventListener('click', () => {
            if (open) { open.panel.remove(); open.chip.setAttribute('aria-expanded', 'false'); }
            if (open && open.chip === chip) { open = null; return; }
            const panel = el('div', 'passage');
            panel.appendChild(el('strong', '', `${source.title} · ${source.section}`));
            // The articles are wrapped Markdown: join wrapped lines, keep blank lines and list items.
            panel.appendChild(document.createTextNode(source.text.replace(/([^\n])\n(?![\n-])/g, '$1 ')));
            bubble.appendChild(panel);
            chip.setAttribute('aria-expanded', 'true');
            open = {chip, panel};
        });
        row.appendChild(chip);
    }
    bubble.appendChild(row);
}

const QUICK_REPLIES = {en: ['Yes, go ahead', 'No'], bg: ['Да, давай', 'Не']};

// Shortcut buttons for a pending confirmation. They only send a normal message: the confirmation itself is still
// checked in code (it must come in a later turn than the offer).
function addQuickReplies(bubble, state) {
    if (!state || !(state.pending || []).length) return;
    const row = el('div', 'quick');
    for (const label of QUICK_REPLIES[state.language] || QUICK_REPLIES.en) {
        const button = el('button', 'ghost', label);
        button.type = 'button';
        button.addEventListener('click', () => {
            if (send.disabled) return;
            row.remove();
            sendMessage(label);
        });
        row.appendChild(button);
    }
    bubble.appendChild(row);
}

function addMessage(role, text, toolCalls, isError) {
    const bubble = el('div', `msg ${role}${isError ? ' error' : ''}`, text);
    if (toolCalls && toolCalls.length) {
        const tools = el('div', 'tools');
        for (const call of toolCalls) {
            const status = /^[a-z_]+$/.test(call.status) ? call.status : 'unknown';
            const chip = el('span', `tool ${status}`, call.name);
            chip.title = `${status} ${JSON.stringify(call.arguments)}`;
            tools.appendChild(chip);
        }
        bubble.appendChild(tools);
        addSources(bubble, toolCalls);
    }
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
}

function renderState(state) {
    const box = document.getElementById('state');
    box.replaceChildren();
    const identity = el('div');
    identity.appendChild(el('span', `badge ${state.identity}`, state.identity));
    if (state.first_name) identity.appendChild(document.createTextNode(` ${state.first_name}`));
    box.appendChild(identity);
    const facts = [['Case', state.case_ref], ['Technician', state.appointment], ['Handover', state.handover_id],
                   ['Customer says', state.outcome && state.outcome.replace('_', ' ')]];
    for (const [label, value] of facts) {
        if (!value) continue;
        const fact = el('div', 'fact');
        fact.appendChild(el('span', '', `${label}: `));
        fact.appendChild(document.createTextNode(value));
        box.appendChild(fact);
    }
    for (const pending of state.pending || []) box.appendChild(el('div', 'pending', `Waiting for an answer: ${pending}`));
}

async function loadDemo() {
    const data = await (await fetch('/api/demo-customers')).json();
    const body = document.getElementById('demo');
    for (const c of data.customers) {
        const row = el('tr');
        row.appendChild(el('td', 'mono', c.account_no));
        row.appendChild(el('td', 'mono', c.pin));
        const scenario = el('td', '', `${c.scenario}: ${c.description}`);
        row.appendChild(scenario);
        body.appendChild(row);
    }
}

function setBusy(busy, text) {
    send.disabled = busy;
    mic.disabled = busy && !recorder;
    hint.textContent = text || '';
}

// One request for typed text (JSON) or a recording (multipart); the reply is shown the same way.
async function postTurn(request, typingText) {
    const typing = addMessage('bot typing', typingText);
    setBusy(true);
    try {
        const response = await fetch(request.url, request.options);
        const data = await response.json();
        typing.remove();
        if (!response.ok) { addMessage('bot', data.message || 'Something went wrong.', [], true); return; }
        // A recording: show what was heard as the customer's message.
        if (data.user_text) messages.appendChild(el('div', 'msg user', `🎤 ${data.user_text}`));
        const bubble = addMessage('bot', data.reply, data.tool_calls, data.system_error);
        renderState(data.state);
        addQuickReplies(bubble, data.state);
        if (document.getElementById('voiceReplies').checked && !data.system_error) {
            speak(data.reply, data.spoken_language || data.state.language);
        }
    } catch (e) {
        typing.remove();
        addMessage('bot', 'The server is not reachable.', [], true);
    } finally {
        setBusy(false);
        input.focus();
    }
}

function sendMessage(text) {
    addMessage('user', text);
    postTurn({url: '/api/customer/chat', options: {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text}),
    }}, 'LineCare is checking…');
}

// --- Voice input: click to start, click again to send ---
mic.addEventListener('click', async () => {
    if (recorder) { recorder.stop(); return; }
    if (send.disabled) return;
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({audio: true});
    } catch {
        hint.textContent = 'Microphone access was blocked. Allow it in the browser, or type instead.';
        return;
    }
    player.pause();
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
    recorder.onstop = () => {
        clearTimeout(recordTimer);
        stream.getTracks().forEach((track) => track.stop());  // release the microphone
        const type = recorder.mimeType || 'audio/webm';
        recorder = null;
        mic.classList.remove('recording');
        const blob = new Blob(chunks, {type});
        if (blob.size < 1000) { setBusy(false, 'The recording was too short.'); return; }
        const form = new FormData();
        form.append('audio', blob, type.includes('ogg') ? 'speech.ogg' : 'speech.webm');
        form.append('language', document.getElementById('speechLanguage').value);
        postTurn({url: '/api/customer/voice', options: {method: 'POST', body: form}}, 'Listening and checking…');
    };
    recorder.start();
    mic.classList.add('recording');
    setBusy(true, 'Recording… click the microphone again to send.');
    mic.disabled = false;
    recordTimer = setTimeout(() => recorder && recorder.stop(), MAX_RECORD_MS);
});

// --- Voice output ---
async function speak(text, language) {
    player.pause();
    const form = new FormData();
    form.append('text', text);
    form.append('language', language || 'en');
    form.append('gender', document.getElementById('voiceGender').value);
    try {
        const response = await fetch('/api/tts', {method: 'POST', body: form});
        if (!response.ok) { hint.textContent = 'Voice reply is not available right now.'; return; }
        player.src = URL.createObjectURL(await response.blob());
        await player.play();
    } catch {
        hint.textContent = 'Voice reply could not be played.';
    }
}

for (const key of ['voiceReplies', 'voiceGender', 'speechLanguage']) {
    const node = document.getElementById(key);
    const saved = localStorage.getItem(key);
    if (saved !== null) node.type === 'checkbox' ? (node.checked = saved === 'true') : (node.value = saved);
    node.addEventListener('change', () => localStorage.setItem(key, node.type === 'checkbox' ? node.checked : node.value));
}

document.getElementById('composer').addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = '';
    sendMessage(text);
});
input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.getElementById('composer').requestSubmit();
    }
});
document.getElementById('newChat').addEventListener('click', async () => {
    const data = await (await fetch('/api/customer/reset', {method: 'POST'})).json();
    messages.replaceChildren();
    if (data.state) renderState(data.state);
    addMessage('bot', 'Hello! I am LineCare, Quillnet\'s support assistant. How can I help?');
});

(async () => {
    addMessage('bot', 'Hello! I am LineCare, Quillnet\'s support assistant. How can I help?');
    const data = await (await fetch('/api/customer/state')).json();
    renderState(data.state);
    await loadDemo();
})();
</script>
</body>
</html>
