<path d="M 20 146 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="28" y="157" class="badge-text">opt</text>
<text x="82" y="157" class="guard">[audio]</text>
<rect x="20" y="344" width="1454" height="474" class="block"/>
<path d="M 20 344 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="28" y="355" class="badge-text">loop</text>
<text x="82" y="355" class="guard">[up to 8 rounds, until the model answers]</text>
<rect x="20" y="932" width="1454" height="220" class="block"/>
<path d="M 20 932 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="28" y="943" class="badge-text">opt</text>
<text x="82" y="943" class="guard">[voice replies on]</text>
<line x1="110" y1="124" x2="290" y2="124" class="edge" marker-end="url(#arrow)"/>
<rect x="91.5" y="103" width="219.0" height="17" rx="8" class="pill"/>
<text x="201.0" y="111.5" class="edge-label" text-anchor="middle">POST /api/customer/chat or /voice</text>
<line x1="292" y1="206" x2="472" y2="206" class="edge" marker-end="url(#arrow)"/>
<rect x="261.2" y="185" width="243.6" height="17" rx="8" class="pill"/>
<text x="383.0" y="193.5" class="edge-label" text-anchor="middle">transcribe, English or Bulgarian only</text>
<line x1="474" y1="252" x2="294" y2="252" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="242.8" y="231" width="280.4" height="17" rx="8" class="pill"/>
<text x="383.0" y="239.5" class="edge-label" text-anchor="middle">text; spoken &#x27;Q N one zero ...&#x27; → QN-100001</text>
<rect x="304.0" y="294" width="598.1" height="38" rx="4" class="note"/>
<text x="314.0" y="309" class="edge-label note-text">session: count the turn, reply language, state block</text>
<text x="314.0" y="323" class="edge-label note-text">(identity, plan, account status, open case, pending confirmations; never PIN or date of birth)</text>
<line x1="292" y1="404" x2="654" y2="404" class="edge" marker-end="url(#arrow)"/>
<rect x="269.2" y="383" width="409.6" height="17" rx="8" class="pill"/>
<text x="474.0" y="391.5" class="edge-label" text-anchor="middle">system prompt + state block + redacted history + 12 tool schemas</text>
<line x1="656" y1="450" x2="294" y2="450" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="312.2" y="429" width="323.5" height="17" rx="8" class="pill"/>
<text x="474.0" y="437.5" class="edge-label" text-anchor="middle">tool calls, e.g. get_router_status + run_line_test</text>
<line x1="292" y1="496" x2="836" y2="496" class="edge" marker-end="url(#arrow)"/>
<rect x="501.6" y="475" width="126.7" height="17" rx="8" class="pill"/>
<text x="565.0" y="483.5" class="edge-label" text-anchor="middle">dispatch each call</text>
<rect x="850.0" y="516" width="462.8" height="24" rx="4" class="note"/>
<text x="860.0" y="531" class="edge-label note-text">allow-list → identity gate → undeclared arguments dropped → never raises</text>
<line x1="838" y1="576" x2="1018" y2="576" class="edge" marker-end="url(#arrow)"/>
<rect x="693.5" y="555" width="471.1" height="17" rx="8" class="pill"/>
<text x="929.0" y="563.5" class="edge-label" text-anchor="middle">verify, outage, line test, router, Wi-Fi, bill, case, technician, handover</text>
<rect x="1032.0" y="596" width="425.9" height="38" rx="4" class="note"/>
<text x="1042.0" y="611" class="edge-label note-text">rules in code: technician eligibility, one open case per issue,</text>
<text x="1042.0" y="625" class="edge-label note-text">restart / booking only with a confirmation id from an earlier turn</text>
<line x1="838" y1="670" x2="1200" y2="670" class="edge" marker-end="url(#arrow)"/>
<rect x="870.5" y="649" width="298.9" height="17" rx="8" class="pill"/>
<text x="1020.0" y="657.5" class="edge-label" text-anchor="middle">search_help: audience = public (fixed in code)</text>
<line x1="1202" y1="716" x2="840" y2="716" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="806.0" y="695" width="428.1" height="17" rx="8" class="pill"/>
<text x="1020.0" y="703.5" class="edge-label" text-anchor="middle">passages above the threshold, re-checked in Python, wrapped as data</text>
<line x1="838" y1="762" x2="294" y2="762" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="384.8" y="741" width="360.4" height="17" rx="8" class="pill"/>
<text x="565.0" y="749.5" class="edge-label" text-anchor="middle">JSON: ok | needs_confirmation | blocked + reason | error</text>
<rect x="304.0" y="782" width="425.9" height="24" rx="4" class="note"/>
<text x="314.0" y="797" class="edge-label note-text">after every round: PINs and dates of birth redacted in the history</text>
<line x1="656" y1="864" x2="294" y2="864" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="386.1" y="843" width="175.9" height="17" rx="8" class="pill"/>
<text x="474.0" y="851.5" class="edge-label" text-anchor="middle">reply (no more tool calls)</text>
<line x1="292" y1="910" x2="112" y2="910" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="91.5" y="889" width="219.0" height="17" rx="8" class="pill"/>
<text x="201.0" y="897.5" class="edge-label" text-anchor="middle">reply, tool + source chips, state</text>
<line x1="110" y1="992" x2="290" y2="992" class="edge" marker-end="url(#arrow)"/>
<rect x="153.0" y="971" width="96.0" height="17" rx="8" class="pill"/>
<text x="201.0" y="979.5" class="edge-label" text-anchor="middle">POST /api/tts</text>
<line x1="292" y1="1038" x2="1382" y2="1038" class="edge" marker-end="url(#arrow)"/>
<rect x="636.3" y="1017" width="403.5" height="17" rx="8" class="pill"/>
<text x="838.0" y="1025.5" class="edge-label" text-anchor="middle">Markdown removed, account and case numbers read in digit groups</text>
<line x1="1384" y1="1084" x2="294" y2="1084" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="820.8" y="1063" width="34.5" height="17" rx="8" class="pill"/>
<text x="838.0" y="1071.5" class="edge-label" text-anchor="middle">MP3</text>
<line x1="292" y1="1130" x2="112" y2="1130" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="177.6" y="1109" width="46.8" height="17" rx="8" class="pill"/>
<text x="201.0" y="1117.5" class="edge-label" text-anchor="middle">audio</text>
<rect x="304.0" y="1172" width="567.4" height="24" rx="4" class="note"/>
<text x="314.0" y="1187" class="edge-label note-text">every turn is logged redacted: text, tool calls with arguments, timings (STT, LLM, tools)</text>
</svg>
