  .lifeline { stroke: #4a5866; stroke-width: 1; stroke-dasharray: 6 4; }
  .edge { stroke: #c9d4de; stroke-width: 1.5; }
  .dashed { stroke-dasharray: 5 4; }
  .pill { fill: #161d24; stroke: #2e3a46; }
  .edge-label { font-size: 11px; fill: #c9d4de; }
  .note { fill: #13262b; stroke: #3fb6c9; stroke-width: 1; stroke-dasharray: 3 3; }
  .note-text { fill: #e9eef3; }
  .block { fill: none; stroke: #6f7f8e; stroke-width: 1.2; }
  .badge { fill: #2e3a46; stroke: #6f7f8e; }
  .badge-text { font-size: 11px; font-weight: 700; }
  .guard { font-size: 11px; fill: #3fb6c9; }
</style>
