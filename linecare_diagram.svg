<rect x="1300.0" y="30" width="168" height="44" rx="6" class="actor"/>
<text x="1384" y="56.5" text-anchor="middle" class="actor-text">edge-tts (online)</text>
<rect x="1300.0" y="1366" width="168" height="44" rx="6" class="actor"/>
<text x="1384" y="1392.5" text-anchor="middle" class="actor-text">edge-tts (online)</text>
<rect x="20" y="146" width="1454" height="128" class="block"/>
<path d="M 20 146 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="28" y="157" class="badge-text">opt</text>
<text x="82" y="157" class="guard">[audio]</text>
<rect x="20" y="344" width="1454" height="624" class="block"/>
<path d="M 20 344 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="28" y="355" class="badge-text">loop</text>
<text x="82" y="355" class="guard">[up to 8 rounds, until the model answers]</text>
<rect x="20" y="1082" width="1454" height="220" class="block"/>
<path d="M 20 1082 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="28" y="1093" class="badge-text">opt</text>
<text x="82" y="1093" class="guard">[voice replies on]</text>
<line x1="110" y1="124" x2="290" y2="124" class="edge" marker-end="url(#arrow)"/>
<rect x="91.5" y="103" width="219.0" height="17" rx="8" class="pill"/>
<text x="201.0" y="111.5" class="edge-label" text-anchor="middle">POST /api/customer/chat or /voice</text>
<line x1="292" y1="206" x2="472" y2="206" class="edge" marker-end="url(#arrow)"/>
<rect x="261.2" y="185" width="243.6" height="17" rx="8" class="pill"/>
<text x="383.0" y="193.5" class="edge-label" text-anchor="middle">transcribe, English or Bulgarian only</text>
<line x1="474" y1="252" x2="294" y2="252" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="242.8" y="231" width="280.4" height="17" rx="8" class="pill"/>
<text x="383.0" y="239.5" class="edge-label" text-anchor="middle">text; spoken &#x27;Q N one zero ...&#x27; → QN-100001</text>
<rect x="304.0" y="294" width="598.1" height="38" rx="4" class="note"/>
<text x="314.0" y="309" class="edge-label note-text">session: count the turn, reply language, state block</text>
<text x="314.0" y="323" class="edge-label note-text">(identity, plan, account status, open case, pending confirmations; never PIN or date of birth)</text>
<line x1="292" y1="404" x2="654" y2="404" class="edge" marker-end="url(#arrow)"/>
<rect x="269.2" y="383" width="409.6" height="17" rx="8" class="pill"/>
<text x="474.0" y="391.5" class="edge-label" text-anchor="middle">system prompt + state block + redacted history + 13 tool schemas</text>
<line x1="656" y1="450" x2="294" y2="450" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="312.2" y="429" width="323.5" height="17" rx="8" class="pill"/>
<text x="474.0" y="437.5" class="edge-label" text-anchor="middle">tool calls, e.g. get_router_status + run_line_test</text>
<line x1="292" y1="496" x2="836" y2="496" class="edge" marker-end="url(#arrow)"/>
<rect x="501.6" y="475" width="126.7" height="17" rx="8" class="pill"/>
<text x="565.0" y="483.5" class="edge-label" text-anchor="middle">dispatch each call</text>
<rect x="850.0" y="516" width="462.8" height="24" rx="4" class="note"/>
<text x="860.0" y="531" class="edge-label note-text">allow-list → identity gate → undeclared arguments dropped → never raises</text>
<line x1="838" y1="576" x2="1018" y2="576" class="edge" marker-end="url(#arrow)"/>
<rect x="693.5" y="555" width="471.1" height="17" rx="8" class="pill"/>
<text x="929.0" y="563.5" class="edge-label" text-anchor="middle">verify, outage, line test, router, Wi-Fi, bill, case, technician, handover</text>
<rect x="1032.0" y="596" width="425.9" height="38" rx="4" class="note"/>
<text x="1042.0" y="611" class="edge-label note-text">rules in code: technician eligibility, one open case per issue,</text>
<text x="1042.0" y="625" class="edge-label note-text">restart / booking only with a confirmation id from an earlier turn</text>
<line x1="1020" y1="690" x2="658" y2="690" class="edge" marker-end="url(#arrow)"/>
<rect x="564.7" y="669" width="548.6" height="17" rx="8" class="pill"/>
<text x="839.0" y="677.5" class="edge-label" text-anchor="middle">confirmation gate (restart, Wi-Fi channel, visit): 2 one-letter questions, in parallel</text>
<line x1="656" y1="736" x2="1018" y2="736" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="593.2" y="715" width="487.6" height="17" rx="8" class="pill"/>
<text x="837.0" y="723.5" class="edge-label" text-anchor="middle">first-token log-probabilities → calibrated p(agrees), p(aimed at the system)</text>
<rect x="1032.0" y="752" width="436" height="38" rx="4" class="note"/>
<text x="1042.0" y="767" class="edge-label note-text">p(agrees) ≥ 0.95 and no flag → run · 0.70–0.95 or flagged</text>
<text x="1042.0" y="782" class="edge-label note-text">→ ask again, offer kept · otherwise → cancel the offer</text>
<line x1="838" y1="820" x2="1200" y2="820" class="edge" marker-end="url(#arrow)"/>
<rect x="870.5" y="799" width="298.9" height="17" rx="8" class="pill"/>
<text x="1020.0" y="807.5" class="edge-label" text-anchor="middle">search_help: audience = public (fixed in code)</text>
<line x1="1202" y1="866" x2="840" y2="866" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="806.0" y="845" width="428.1" height="17" rx="8" class="pill"/>
<text x="1020.0" y="853.5" class="edge-label" text-anchor="middle">passages above the threshold, re-checked in Python, wrapped as data</text>
<line x1="838" y1="912" x2="294" y2="912" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="384.8" y="891" width="360.4" height="17" rx="8" class="pill"/>
<text x="565.0" y="899.5" class="edge-label" text-anchor="middle">JSON: ok | needs_confirmation | blocked + reason | error</text>
<rect x="304.0" y="932" width="425.9" height="24" rx="4" class="note"/>
<text x="314.0" y="947" class="edge-label note-text">after every round: PINs and dates of birth redacted in the history</text>
<line x1="656" y1="1014" x2="294" y2="1014" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="386.1" y="993" width="175.9" height="17" rx="8" class="pill"/>
<text x="474.0" y="1001.5" class="edge-label" text-anchor="middle">reply (no more tool calls)</text>
<line x1="292" y1="1060" x2="112" y2="1060" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="91.5" y="1039" width="219.0" height="17" rx="8" class="pill"/>
<text x="201.0" y="1047.5" class="edge-label" text-anchor="middle">reply, tool + source chips, state</text>
<line x1="110" y1="1142" x2="290" y2="1142" class="edge" marker-end="url(#arrow)"/>
<rect x="153.0" y="1121" width="96.0" height="17" rx="8" class="pill"/>
<text x="201.0" y="1129.5" class="edge-label" text-anchor="middle">POST /api/tts</text>
<line x1="292" y1="1188" x2="1382" y2="1188" class="edge" marker-end="url(#arrow)"/>
<rect x="636.3" y="1167" width="403.5" height="17" rx="8" class="pill"/>
<text x="838.0" y="1175.5" class="edge-label" text-anchor="middle">Markdown removed, account and case numbers read in digit groups</text>
<line x1="1384" y1="1234" x2="294" y2="1234" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="820.8" y="1213" width="34.5" height="17" rx="8" class="pill"/>
<text x="838.0" y="1221.5" class="edge-label" text-anchor="middle">MP3</text>
<line x1="292" y1="1280" x2="112" y2="1280" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="177.6" y="1259" width="46.8" height="17" rx="8" class="pill"/>
<text x="201.0" y="1267.5" class="edge-label" text-anchor="middle">audio</text>
<rect x="304.0" y="1322" width="567.4" height="24" rx="4" class="note"/>
<text x="314.0" y="1337" class="edge-label note-text">every turn is logged redacted: text, tool calls with arguments, timings (STT, LLM, tools)</text>
<rect x="700" y="980" width="760" height="38" rx="4" class="note"/>
<text x="710" y="995" class="edge-label note-text">every turn, in parallel with the loop: wants-a-person gate (one letter, p ≥ 0.5, sees the agent's last message)</text>
<text x="710" y="1009" class="edge-label note-text">asked for a person and the agent did not hand over → the code calls handover_to_human</text>
</svg>
