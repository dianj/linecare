<rect x="936.0" y="30" width="168" height="44" rx="6" class="actor"/>
<text x="1020" y="56.5" text-anchor="middle" class="actor-text">Tools, mock systems, CRM</text>
<rect x="936.0" y="1216" width="168" height="44" rx="6" class="actor"/>
<text x="1020" y="1242.5" text-anchor="middle" class="actor-text">Tools, mock systems, CRM</text>
