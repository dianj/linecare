<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1494 1430" width="1494" height="1430" role="img" aria-label="Sequence diagram of one LineCare customer turn">
<title>One customer turn: text or voice in, tool loop behind the session gate, the rules in code, a calibrated confirmation gate and a wants-a-person gate, access-controlled knowledge base, reply with sources and optional voice out</title>
<style>
  svg { background: #0f1419; }
  text { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #e9eef3; }
