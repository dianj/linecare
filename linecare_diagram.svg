<rect x="572.0" y="30" width="168" height="44" rx="6" class="actor"/>
<text x="656" y="56.5" text-anchor="middle" class="actor-text">Gemma / Qwen (LM Studio)</text>
<rect x="572.0" y="1366" width="168" height="44" rx="6" class="actor"/>
<text x="656" y="1392.5" text-anchor="middle" class="actor-text">Gemma / Qwen (LM Studio)</text>
<line x1="838" y1="74" x2="838" y2="1366" class="lifeline"/>
<rect x="754.0" y="30" width="168" height="44" rx="6" class="actor"/>
<text x="838" y="56.5" text-anchor="middle" class="actor-text">Registry + session gate</text>
<rect x="754.0" y="1366" width="168" height="44" rx="6" class="actor"/>
<text x="838" y="1392.5" text-anchor="middle" class="actor-text">Registry + session gate</text>
<line x1="1020" y1="74" x2="1020" y2="1366" class="lifeline"/>
<rect x="936.0" y="30" width="168" height="44" rx="6" class="actor"/>
<text x="1020" y="56.5" text-anchor="middle" class="actor-text">Tools, mock systems, CRM</text>
<rect x="936.0" y="1366" width="168" height="44" rx="6" class="actor"/>
<text x="1020" y="1392.5" text-anchor="middle" class="actor-text">Tools, mock systems, CRM</text>
<line x1="1202" y1="74" x2="1202" y2="1366" class="lifeline"/>
<rect x="1118.0" y="30" width="168" height="44" rx="6" class="actor"/>
<text x="1202" y="56.5" text-anchor="middle" class="actor-text">Knowledge base (Chroma)</text>
